<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms & Input Tags</title>
</head>
<body>
    <h1>Learning Form and Input Tags</h1>
    <form action="post">
    <div>
        <label for="username">Enter Your Username</label>
        <br>
        <input type="text" name="username" id="username" placeholder="Enter Your username">
    </div>
    <div>
        <input type="radio" name="gender" id="male" value="male">
        <label for="male">Male</label>
        <input type="radio" name="gender" id="female" value="female">
        <label for="female">Female</label>
    </div>
    <div>
        <label for="Lang">Programming Language</label>
        <select name="Programming Languages" id="Lang">
            <option value="HTML">HTML</option>
            <option value="CSS">CSS</option>
            <option value="Java Script">Java Script</option>
        </select>
    </div>
    <div>
        <label for="comment">Enter Your Comment Here</label>
        <br>
        <textarea name="comment" rows="4" cols="50" id="comment"></textarea>
    </div>
    <div>
        <input type="checkbox" name="Do You Agree To All Terms And Condition" id="Terms" value="Yes">
        <label for="Terms">Do you Agree To All Terms and Condition</label>
    </div>
    </form>
</body>
</html>
